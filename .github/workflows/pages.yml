name: Deploy Project Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish docs/ to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Landing Page Assets
        run: |
          test -s docs/index.html
          test -s docs/404.html
          test -s docs/assets/qrypt-logo.svg
          test -s docs/assets/og-banner.png
          test -s docs/screenshots/01-scanner-screen.png
          test -s docs/screenshots/08-light-theme-preview.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
