<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404: Page Not Found | QRYPT QR &amp; Barcode Scanner</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/QRYPT/assets/qrypt-logo.svg" />
  <style>
    :root {
      --bg-primary: #070B14;
      --bg-surface: #0D1424;
      --bg-elevated: #121D30;
      --accent-cyan: #00E5FF;
      --accent-blue: #3B82F6;
      --text-primary: #F5FAFF;
      --text-secondary: #A9B7C9;
      --border-subtle: rgba(0, 229, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      background-image: radial-gradient(circle at 50% 25%, rgba(0, 229, 255, 0.12) 0%, transparent 50%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      max-width: 540px;
      width: 100%;
      background: linear-gradient(180deg, var(--bg-surface), var(--bg-elevated));
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .code-badge {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.94rem;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #070B14;
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="code-badge">OPTICAL RETICLE • HTTP 404</span>
    <h1>Target Payload Not Found</h1>
    <p>
      The page or resource you requested could not be decoded at this URL. Return to the QRYPT product page or explore the open-source repository on GitHub.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/QRYPT/">Back to QRYPT Home</a>
      <a class="btn btn-secondary" href="https://github.com/CodeByArnob/QRYPT/releases/latest">Download Android APK</a>
      <a class="btn btn-secondary" href="https://github.com/CodeByArnob/QRYPT">GitHub Repository</a>
    </div>
  </main>
</body>
</html>
